[project]
name = "cad-helper"
version = "0.2.0"
description = "Landscape plans for AutoCAD, drawn by a coding agent: describe a garden, get a layered DXF."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "vinter-man" }]
requires-python = ">=3.11"
keywords = ["autocad", "dxf", "landscape", "cad", "ezdxf", "claude-code"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "ezdxf>=1.3",
    "matplotlib>=3.8",
]

[project.scripts]
cad-helper = "cad_helper.cli:main"

[project.urls]
Repository = "https://github.com/vinter-man/cad-helper"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cad_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md", "docs/demo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"projects/*/build.py" = ["E402"]
